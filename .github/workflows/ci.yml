name: Regression checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    name: Python and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: sentinelai_ci
          POSTGRES_DB: sentinelai_ci_test
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U sentinelai_ci -d sentinelai_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENTINELAI_CI_SYNTHETIC_ONLY: "1"
      SENTINELAI_DB_HOST: 127.0.0.1
      SENTINELAI_DB_USER: sentinelai_ci
      SENTINELAI_DB_NAME: sentinelai_ci_unused
      SENTINELAI_DB_TEST_NAME: sentinelai_ci_test
      SENTINELAI_DB_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.3"
      - name: Install pinned Python dependencies
        run: |
          python -m pip install pip==26.3
          python -m pip install --only-binary=:all: -r ml/requirements-baseline.txt -r backend/requirements.txt
          python -m pip install --only-binary=:all: -r requirements-dev.txt
          python -m pip check
      - name: Check Python lint and adopted formatting
        run: |
          python -m ruff check backend migrations ml tests
          python -m ruff format --check backend/database.py tests/test_database.py
      - name: Report backend complexity above 10
        run: python -m ruff check --select C901 --exit-zero backend
      - name: Report Python advisories for installed dependencies
        continue-on-error: true
        run: python -m pip_audit --progress-spinner off --timeout 15
      - name: Test Python and database migrations
        run: python -B -m unittest discover -s tests -v
        env:
          SENTINELAI_DB_PORT: ${{ job.services.postgres.ports[5432] }}

  frontend:
    name: Frontend, TypeScript and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.5"
      - name: Install lockfile dependencies
        run: npm ci
      - name: Check JavaScript dependency advisories
        run: npm audit --audit-level=high
      - name: Check adopted frontend formatting
        run: npm run format:check
      - name: Check typed lint, React Hooks, and JSX accessibility
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Check TypeScript and build
        run: npm run build
      - name: Report production Python and TypeScript duplication
        working-directory: .
        run: >-
          frontend/node_modules/.bin/jscpd --min-lines 6 --min-tokens 50
          --format python,typescript,tsx --ignore '**/*.test.ts,**/*.test.tsx,**/__pycache__/**'
          --fail-on-empty --no-colors --no-tips backend frontend/src
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.3"
      - name: Install Python imports for Pyright evaluation
        working-directory: .
        run: python -m pip install --only-binary=:all: -r backend/requirements.txt -r ml/requirements-baseline.txt
      - name: Report Pyright diagnostics for selected backend modules
        continue-on-error: true
        working-directory: .
        run: frontend/node_modules/.bin/pyright --pythonpath "$(command -v python)"

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan checked-out commit history with redaction
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=HEAD
