name: Regression checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    name: Python and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: sentinelai_ci
          POSTGRES_DB: sentinelai_ci_test
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U sentinelai_ci -d sentinelai_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENTINELAI_CI_SYNTHETIC_ONLY: "1"
      SENTINELAI_DB_HOST: 127.0.0.1
      SENTINELAI_DB_USER: sentinelai_ci
      SENTINELAI_DB_NAME: sentinelai_ci_unused
      SENTINELAI_DB_TEST_NAME: sentinelai_ci_test
      SENTINELAI_DB_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.3"
      - name: Install pinned Python dependencies
        run: |
          python -m pip install pip==26.3
          python -m pip install --only-binary=:all: -r ml/requirements-baseline.txt -r backend/requirements.txt
          python -m pip check
      - name: Test Python and database migrations
        run: python -B -m unittest discover -s tests -v
        env:
          SENTINELAI_DB_PORT: ${{ job.services.postgres.ports[5432] }}

  frontend:
    name: Frontend, TypeScript and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.5"
      - name: Install lockfile dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Check TypeScript and build
        run: npm run build
