target-version = "py312"
line-length = 110

[lint]
select = [
    "E4", "E7", "E9", "F", "RUF013", "B", "I",
    "S102", "S307", "S324", "S506", "S608", "S609", "S610", "S611",
]

[lint.per-file-ignores]
# Preserve historical research source fingerprints and avoid unrelated test reformatting.
"ml/**" = ["I", "B023", "B905"]
"tests/**" = ["I", "B007", "B023", "B905"]

[lint.mccabe]
max-complexity = 10
